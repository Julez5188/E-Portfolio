<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia Maximov</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/8c2874cba0.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="aboutme">
    <nav> 
      <div class="personal__logo">Julia Maximov</div>
      <ul class="nav__link--list">
        <li>
          <a href="#languages" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Languages</a>
        </li>
        <li>
          <a href="#projects" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Projects</a>
        </li>
        <li>
          <a href="#contact" class="
          nav__link--anchor
          nav__link--anchor-primary
          ">Contact</a>
        </li>
      </ul>
    </nav>
    <div class="flex flex-1">
      <div class="about-me__info row">
        <div class="about-me__info--container">
          <figure class="about-me__picture--mask">
            <img src="./assets/me.jpg" class="about-me__picture" alt="Julia Maximov">
          </figure>
          <h1 class="about-me__info--title">
            Hey! I'm <span class="text--blue">Julia Maximov</span> 👋
          </h1>
          <p class="about-me__info--para">
            I'm a <strong class="text--blue">front-end developer</strong> with a passion for creating beautiful and functional web applications. I love to learn new technologies and improve my skills every day.
          </p>
          <div class="about-me__links">
            <a href="#link" class="about-me__link">
              <i class="fa-brands fa-linkedin"></i>
            </a>
            <a href="#github" class="about-me__link">
              <i class="fa-brands fa-github"></i></a>
              <a href="#contact" class="about-me__link">
                <i class="fa-solid fa-envelope"></i>
              </a>
              <a href="#files" class="about-me__link">
                <i class="fa-solid fa-file"></i>
              </a>
          </div>
        </div>
        <figure class="about-me__img--container">
          <img src="./assets/undraw_web-development_f0tp.svg" class="about-me__img" alt="main image">
        </figure>
      </div>
    </div>
  </section>
  <section id="languages">
    <div class="container">
      <div class="row">
        <h1 class="section__title">This is my technology stack</h1>
        <div class="language__list">
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="./assets/html.jpg" alt="html image" class="language__img">
            </figure>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
